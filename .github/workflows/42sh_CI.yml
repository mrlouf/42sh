name: CI

on:
  # Triggers the workflow on push or pull request events for specific branches
  push:
    branches: 
      - main
      - develop
      - np-github_ci2
  pull_request:
    branches: 
      - main
      - develop

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build-ubuntu:
    name: Test 42sh on Ubuntu
    runs-on: ubuntu-latest

    steps:
      # Check out the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install readline
        run: sudo apt-get install libreadline-dev -y

      - name: Compile 42sh
        run: make

      - name: Run basic tests
        run: chmod +x ./tests/basic.sh && ./tests/basic.sh

  build-macOS:
    name: Test on macOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install readline
        run: brew install readline

      - name: Compile 42sh
        run: make

      - name: Run basic tests
        run: chmod +x ./tests/basic.sh && ./tests/basic.sh
